# Local-to-server deploy: ships your `data/` tree.
# Generated/used with `deploy/scripts/export-server-bundle.sh` (also copied as `docker-compose.yaml` in the bundle).
#
# Replaces the production named volume with bind mounts so the zip/scp you upload
# can carry the same `data` you used when configuring CDC.
#
# On the server, from the extracted folder:
#   docker compose --env-file .env up -d
#
# Requires: Linux, Docker Compose v2, and ./data directory (the export script creates it).

services:
  bittice:
    image: ${BITTICE_IMAGE:?set BITTICE_IMAGE in .env or environment}
    container_name: bittice
    restart: always
    labels:
      - com.centurylinklabs.watchtower.enable=true
    ports:
      - "${BITTICE_REST_PORT:-3000}:3000"
      - "${BITTICE_REST_ADMIN_PORT:-8080}:8080"
      - "${BITTICE_GRPC_PORT:-50051}:50051"
    environment:
      BITTICE_HOST: ${BITTICE_HOST:-0.0.0.0}
      BITTICE_ENGINE_ONLY: ${BITTICE_ENGINE_ONLY:-1}
      BITTICE_CDC_HEALTH_CHECK_MAX_FAILURES: ${BITTICE_CDC_HEALTH_CHECK_MAX_FAILURES:-0}
      BITTICE_CDC_VPN_RESTART_COOLDOWN_SECS: ${BITTICE_CDC_VPN_RESTART_COOLDOWN_SECS:-20}
      BITTICE_MAX_OPEN_TABLES: ${BITTICE_MAX_OPEN_TABLES:-20}
    volumes:
      - ./data:/app/data

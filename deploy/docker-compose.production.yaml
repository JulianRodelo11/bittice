# Foreground-style service: Bittice engine with persisted data.
# From this deploy/ directory:
#   cp .env.example .env
#   docker compose -f docker-compose.production.yaml up -d
#
# From bittice repository root:
#   cp deploy/.env.example deploy/.env
#   docker compose -f deploy/docker-compose.production.yaml --env-file deploy/.env up -d
#
# Data: named volume bittice-data (name follows Compose project directory rules).

services:
  bittice:
    image: ${BITTICE_IMAGE:?set BITTICE_IMAGE in .env or environment}
    container_name: bittice
    restart: always
    labels:
      - com.centurylinklabs.watchtower.enable=true
    ports:
      - "${BITTICE_REST_PORT:-3000}:3000"
      - "${BITTICE_REST_ADMIN_PORT:-8080}:8080"
      - "${BITTICE_GRPC_PORT:-50051}:50051"
    environment:
      BITTICE_HOST: ${BITTICE_HOST:-0.0.0.0}
      BITTICE_ENGINE_ONLY: ${BITTICE_ENGINE_ONLY:-1}
      BITTICE_CDC_HEALTH_CHECK_MAX_FAILURES: ${BITTICE_CDC_HEALTH_CHECK_MAX_FAILURES:-0}
      BITTICE_CDC_VPN_RESTART_COOLDOWN_SECS: ${BITTICE_CDC_VPN_RESTART_COOLDOWN_SECS:-20}
      BITTICE_MAX_OPEN_TABLES: ${BITTICE_MAX_OPEN_TABLES:-20}
      BITTICE_OPS_TABLE_CACHE_PRIORITY: ${BITTICE_OPS_TABLE_CACHE_PRIORITY:-1}
    volumes:
      - bittice-data:/app/data

volumes:
  bittice-data:

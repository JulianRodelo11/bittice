# Local dev replica of the EC2 VPN+Bittice setup.
# Run from the bittice repo root:
#
#   # Prepare vpn.conf (only needed once or when .ovpn changes)
#   cp data/vpn/bittice-ec2.ovpn data/vpn/vpn.conf
#
#   docker compose -f deploy/docker-compose.local.yaml up
#
# gRPC: localhost:50051  REST: localhost:3000  Admin: localhost:8080

services:
  vpn:
    image: dperson/openvpn-client:latest
    container_name: bittice-vpn-local
    cap_add: [NET_ADMIN, NET_RAW]
    devices: ["/dev/net/tun"]
    volumes:
      - ../data/vpn:/vpn
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:50051:50051"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ip", "link", "show", "tun0"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  bittice:
    image: "ghcr.io/julianrodelo11/bittice:v0.1.97"
    container_name: bittice-local
    network_mode: "service:vpn"
    depends_on:
      vpn:
        condition: service_healthy
    volumes:
      - ../data:/app/data
    environment:
      - BITTICE_HOST=0.0.0.0
      - BITTICE_ENGINE_ONLY=1
      - BITTICE_CDC_HEALTH_CHECK_MAX_FAILURES=0
      - BITTICE_CDC_HEALTH_CHECK_INTERVAL_SECS=120
      - BITTICE_CDC_VPN_RESTART_COOLDOWN_SECS=20
      - BITTICE_CDC_STREAM_SILENCE_TIMEOUT_SECS=90
      - BITTICE_SKIP_STARTUP_COMPACT=1
    restart: unless-stopped

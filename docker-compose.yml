services:
  bittice:
    build: .
    container_name: bittice-container
    ports:
      - "3000:3000"
      - "50051:50051"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 500M
    volumes:
      - ./data:/app/data
    environment:
      - BITTICE_HOST=0.0.0.0
    restart: unless-stopped
    # El modo 'all' activa REST (3000), gRPC (50051) y los CDC workers automáticos
    command: ["./bittice", "server", "--type", "all", "--port", "50051"]

services:
  bittice:
    build: .
    container_name: bittice-container
    # Quitamos el comando fijo para que use el default del Dockerfile (que cambiaremos a interactivo)
    # o simplemente lo dejamos libre para entrar manualmente.
    stdin_open: true # corresponde a -i
    tty: true        # corresponde a -t
    ports:
      - "3000:3000"
      - "50051:50051"
    volumes:
      - ./data:/app/data
      - ${HOME:-$USERPROFILE}:/app/host_home:ro
    environment:
      - BITTICE_HOST=0.0.0.0
    privileged: true
    cap_add:
      - NET_ADMIN
    devices:
      - "/dev/net/tun:/dev/net/tun"
    restart: "no" # En modo interfaz no queremos que se reinicie solo si cerramos el menú

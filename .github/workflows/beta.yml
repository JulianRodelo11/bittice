name: beta

on:
  push:
    tags:
      - 'beta-*'
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

jobs:
  sync:
    # Mirror: original uses blacksmith-4vcpu-ubuntu-2404
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # --- Step 1: Checkout with full history (needed for merge) ---
      # Same as original: actions/checkout@v4 with fetch-depth: 0
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --- Step 2: Setup Rust toolchain (adaptation: original uses Setup Bun) ---
      # Replaces the original `.github/actions/setup-bun` composite action
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # --- Step 3: Configure Git committer identity ---
      # Mirror of original `.github/actions/setup-git-committer`
      # which sets up a GitHub App token for authenticated git operations
      - name: Setup Git Committer
        id: setup-git-committer
        uses: tibdex/github-app-token@v2
        with:
          app_id: ${{ vars.BITTICE_APP_ID }}
          private_key: ${{ secrets.BITTICE_APP_SECRET }}

      # --- Step 4: Install the bittice CLI ---
      # Mirror: original runs `bun i -g opencode-ai`
      # Adaptation: build bittice from source (Rust)
      - name: Build bittice
        run: cargo build --release

      # --- Step 5: Sync the beta branch ---
      # Mirror: original runs `bun script/beta.ts`
      # Adaptation: use the built bittice binary to run the sync
      - name: Sync beta branch
        env:
          GH_TOKEN: ${{ steps.setup-git-committer.outputs.token }}
          BITTICE_API_KEY: ${{ secrets.BITTICE_API_KEY }}
        run: ./target/release/bittice script/beta.ts

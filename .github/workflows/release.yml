name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  build-binaries:
    name: Build Binaries
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            artifact_name: bittice-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            artifact_name: bittice-linux-aarch64
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact_name: bittice-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: bittice-macos-aarch64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: bittice-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Compilers (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu musl-tools

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build Binary
        shell: bash
        run: |
          if [ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" ]; then
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
          fi
          # PROTOC se autogestiona ahora con protobuf-src en build.rs
          cargo build --release --target ${{ matrix.target }}

      - name: Prepare Artifact
        shell: bash
        run: |
          mkdir -p dist
          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            cp target/${{ matrix.target }}/release/bittice.exe dist/${{ matrix.artifact_name }}
          else
            cp target/${{ matrix.target }}/release/bittice dist/${{ matrix.artifact_name }}
          fi

      - name: Upload Artifacts for Docker
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'alpha') }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Build & Push Docker Image
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Linux Binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Prepare Docker Build Context
        run: |
          cp artifacts/bittice-linux-x86_64/bittice-linux-x86_64 bittice-linux-amd64
          cp artifacts/bittice-linux-aarch64/bittice-linux-aarch64 bittice-linux-arm64
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set Repo Name (Lowercase)
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT
      - name: Build and Push AMD64
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            BINARY_PATH=bittice-linux-amd64
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}:${{ github.ref_name }}-amd64
      - name: Build and Push ARM64
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: true
          build-args: |
            BINARY_PATH=bittice-linux-arm64
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}:${{ github.ref_name }}-arm64
      - name: Create Multi-Arch Manifest
        run: |
          docker buildx imagetools create -t ghcr.io/${{ steps.repo.outputs.name }}:${{ github.ref_name }} \
            ghcr.io/${{ steps.repo.outputs.name }}:${{ github.ref_name }}-amd64 \
            ghcr.io/${{ steps.repo.outputs.name }}:${{ github.ref_name }}-arm64

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  build-binaries:
    name: Build Binaries
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            artifact_name: bittice-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            artifact_name: bittice-linux-aarch64
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact_name: bittice-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: bittice-macos-aarch64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: bittice-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Compilers (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu musl-tools

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build Binary
        shell: bash
        run: |
          if [ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" ]; then
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
          fi
          # PROTOC se autogestiona ahora con protobuf-src en build.rs
          cargo build --release --target ${{ matrix.target }}

      - name: Prepare Artifact
        shell: bash
        run: |
          mkdir -p dist
          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            cp target/${{ matrix.target }}/release/bittice.exe dist/${{ matrix.artifact_name }}
          else
            cp target/${{ matrix.target }}/release/bittice dist/${{ matrix.artifact_name }}
          fi

      - name: Upload Artifacts for Docker
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}

  release-publish:
    name: Publish GitHub release (per-OS bundles + standalone binaries)
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble standalone binaries and OS bundles
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p individual bundle-darwin bundle-linux bundle-win

          cp artifacts/bittice-linux-x86_64/bittice-linux-x86_64 individual/
          cp artifacts/bittice-linux-aarch64/bittice-linux-aarch64 individual/
          cp artifacts/bittice-macos-x86_64/bittice-macos-x86_64 individual/
          cp artifacts/bittice-macos-aarch64/bittice-macos-aarch64 individual/
          cp artifacts/bittice-windows-x86_64.exe/bittice-windows-x86_64.exe individual/

          cp artifacts/bittice-macos-x86_64/bittice-macos-x86_64 bundle-darwin/bittice-x86_64-apple-darwin
          cp artifacts/bittice-macos-aarch64/bittice-macos-aarch64 bundle-darwin/bittice-aarch64-apple-darwin
          chmod +x bundle-darwin/*
          cat > bundle-darwin/INSTALL.txt <<EOF
          Bittice ${REF_NAME} for macOS (Intel + Apple Silicon)

          Pick the binary for your architecture, then:
            Intel:         sudo cp bittice-x86_64-apple-darwin /usr/local/bin/bittice && sudo chmod +x /usr/local/bin/bittice
            Apple Silicon: sudo cp bittice-aarch64-apple-darwin /usr/local/bin/bittice && sudo chmod +x /usr/local/bin/bittice

          Or use the installer (detects OS/arch):
            curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${REF_NAME}/install.sh | bash
          EOF
          (cd bundle-darwin && zip -r "../bittice-${REF_NAME}-macos.zip" .)

          cp artifacts/bittice-linux-x86_64/bittice-linux-x86_64 bundle-linux/bittice-x86_64-unknown-linux-musl
          cp artifacts/bittice-linux-aarch64/bittice-linux-aarch64 bundle-linux/bittice-aarch64-unknown-linux-gnu
          chmod +x bundle-linux/*
          cat > bundle-linux/INSTALL.txt <<EOF
          Bittice ${REF_NAME} for Linux (x86_64 + aarch64)

          Binaries:
            x86_64 / amd64: bittice-x86_64-unknown-linux-musl  -> e.g. sudo install -m 755 ... /usr/local/bin/bittice
            aarch64 / arm64: bittice-aarch64-unknown-linux-gnu

          Or use the installer:
            curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${REF_NAME}/install.sh | bash
          EOF
          tar -czvf "bittice-${REF_NAME}-linux.tar.gz" -C bundle-linux .

          cp artifacts/bittice-windows-x86_64.exe/bittice-windows-x86_64.exe bundle-win/bittice.exe
          printf '%s\r\n' "Bittice ${REF_NAME} for Windows (x86_64)." "" "Run bittice.exe from this folder or add it to your PATH." > bundle-win/INSTALL.txt
          (cd bundle-win && zip -r "../bittice-${REF_NAME}-windows.zip" .)

          cat > "bittice-${REF_NAME}-downloads.json" <<EOF
          {
            "tag": "${REF_NAME}",
            "repository": "${GITHUB_REPOSITORY}",
            "bundles": {
              "macos": { "filename": "bittice-${REF_NAME}-macos.zip", "format": "zip", "members": ["bittice-x86_64-apple-darwin", "bittice-aarch64-apple-darwin"] },
              "linux": { "filename": "bittice-${REF_NAME}-linux.tar.gz", "format": "tar.gz", "members": ["bittice-x86_64-unknown-linux-musl", "bittice-aarch64-unknown-linux-gnu"] },
              "windows": { "filename": "bittice-${REF_NAME}-windows.zip", "format": "zip", "members": ["bittice.exe"] }
            },
            "standalone_binaries": {
              "bittice-linux-x86_64": "Linux x86_64 (musl)",
              "bittice-linux-aarch64": "Linux aarch64 (gnu)",
              "bittice-macos-x86_64": "macOS Intel",
              "bittice-macos-aarch64": "macOS Apple Silicon",
              "bittice-windows-x86_64.exe": "Windows x86_64"
            }
          }
          EOF

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'alpha') }}
          fail_on_unmatched_files: true
          files: |
            individual/bittice-linux-x86_64
            individual/bittice-linux-aarch64
            individual/bittice-macos-x86_64
            individual/bittice-macos-aarch64
            individual/bittice-windows-x86_64.exe
            bittice-${{ github.ref_name }}-macos.zip
            bittice-${{ github.ref_name }}-linux.tar.gz
            bittice-${{ github.ref_name }}-windows.zip
            bittice-${{ github.ref_name }}-downloads.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Build & Push Docker Image
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux Binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare Docker Build Context
        run: |
          cp artifacts/bittice-linux-x86_64/bittice-linux-x86_64 bittice-linux-amd64
          cp artifacts/bittice-linux-aarch64/bittice-linux-aarch64 bittice-linux-arm64

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set Repo Name (Lowercase)
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT
      - name: Build and Push AMD64
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            BINARY_PATH=bittice-linux-amd64
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}:${{ github.ref_name }}-amd64
      - name: Build and Push ARM64
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/arm64
          push: true
          build-args: |
            BINARY_PATH=bittice-linux-arm64
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}:${{ github.ref_name }}-arm64
      - name: Create Multi-Arch Manifest
        run: |
          docker buildx imagetools create -t ghcr.io/${{ steps.repo.outputs.name }}:${{ github.ref_name }} \
            ghcr.io/${{ steps.repo.outputs.name }}:${{ github.ref_name }}-amd64 \
            ghcr.io/${{ steps.repo.outputs.name }}:${{ github.ref_name }}-arm64

  attach-server-bundle:
    name: Server bundle (no git clone)
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build zip for bare-metal deploy
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          REPO_LOWER="${GITHUB_REPOSITORY,,}"
          mkdir -p server-bundle
          cp deploy/docker-compose.production.yaml server-bundle/docker-compose.yaml
          cp deploy/docker-compose.vpn.yaml server-bundle/
          cp deploy/SERVER_QUICKSTART.md server-bundle/README.md
          {
            echo "# Image published by GitHub Actions for ${REF_NAME}"
            echo "BITTICE_IMAGE=ghcr.io/${REPO_LOWER}:${REF_NAME}"
            echo "BITTICE_HOST=0.0.0.0"
            echo "BITTICE_REST_PORT=3000"
            echo "BITTICE_GRPC_PORT=50051"
          } > server-bundle/.env
          zip -r "bittice-server-${REF_NAME}.zip" server-bundle
          rm -rf server-bundle

      - name: Upload bundle to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: bittice-server-${{ github.ref_name }}.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

[package]
name = "bittice"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
roaring = "0.10"
# Nuevas dependencias para CLI
clap = { version = "4.4", features = ["derive"] }

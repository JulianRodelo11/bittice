[package]
name = "bittice"
version = "0.1.59"
edition = "2021"
license = "Elastic-2.0"



[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
bincode = "1.3"
roaring = { version = "0.10", features = ["serde"] }
# CLI dependencies
clap = { version = "4.4", features = ["derive"] }
cliclack = "0.3"
console = "0.15"
indicatif = "0.17"
anyhow = "1.0"
memmap2 = "0.9"
tokio = { version = "1.36", features = ["full"] }
axum = { version = "0.7.5", features = ["macros"] }
tower-http = { version = "0.5.2", features = ["trace", "cors", "catch-panic"] }
tracing = "0.1.40"
tracing-subscriber = "0.3.18"
base64 = "0.21"
rayon = "1.10"
uuid = { version = "1.21.0", features = ["v4"] }
mysql_async = { version = "0.34", default-features = false, features = ["minimal", "rustls-tls", "binlog"] }
mysql_common = "0.32"
tonic = { version = "0.12", default-features = false, features = ["prost", "codegen", "tls", "tls-roots", "server"] }
prost = "0.13"
tokio-stream = "0.1"
chrono = { version = "0.4.44", features = ["serde"] }
self_update = { version = "0.41", default-features = false, features = ["archive-tar", "archive-zip", "compression-flate2", "compression-zip-deflate", "rustls"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
evalexpr = "8.1"

[dev-dependencies]
tempfile = "3.10"

[build-dependencies]
tonic-build = "0.12"
prost-build = "0.13"
protoc-bin-vendored = "3.0"

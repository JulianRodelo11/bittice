[package]
name = "bittice"
version = "0.1.143"
edition = "2021"
license = "Elastic-2.0"



[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
bincode = "1.3"
roaring = { version = "0.10", features = ["serde"] }
libc = "0.2"
# CLI dependencies
clap = { version = "4.4", features = ["derive"] }
cliclack = "0.3"
console = "0.15"
indicatif = "0.17"
anyhow = "1.0"
memmap2 = "0.9"
lru = "0.12"
tokio = { version = "1.36", features = ["full"] }
axum = { version = "0.7.5", features = ["macros"] }
tower-http = { version = "0.5.2", features = ["trace", "cors", "catch-panic"] }
tracing = "0.1.40"
tracing-subscriber = "0.3.18"
base64 = "0.21"
rayon = "1.10"
uuid = { version = "1.21.0", features = ["v4"] }
mysql_async = { version = "0.34", default-features = false, features = ["minimal", "rustls-tls", "binlog"] }
mysql_common = "0.32"
tonic = { version = "0.12", default-features = false, features = ["prost", "codegen", "tls", "tls-roots", "server"] }
prost = "0.13"
tokio-stream = "0.1"
chrono = { version = "0.4.44", features = ["serde"] }
self_update = { version = "0.41", default-features = false, features = ["archive-tar", "archive-zip", "compression-flate2", "compression-zip-deflate", "rustls"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
# Direct dependency only so we can call `install_default()` at process start.
# Both `aws-lc-rs` and `ring` providers are already in the dep tree (pulled in
# transitively by reqwest/mysql_async); rustls 0.23 panics at runtime when more
# than one is present and no default is installed. Picking `ring` here is the
# tie-breaker, not an extra dependency.
rustls = { version = "0.23", default-features = false }
zip = { version = "2", default-features = false, features = ["deflate"] }
evalexpr = "8.1"
unicode-normalization = "0.1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
parking_lot = "0.12"
once_cell = "1.19"
argon2 = "0.5"

[dev-dependencies]
tempfile = "3.10"
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }

[build-dependencies]
tonic-build = "0.12"
prost-build = "0.13"
protoc-bin-vendored = "3.0"

[[bench]]
name = "primary_index_ops"
harness = false

[[bench]]
name = "table_ops"
harness = false

[[bench]]
name = "open_time"
harness = false

[[bench]]
name = "ram_usage"
harness = false

[[bench]]
name = "exact_index_ops"
harness = false

[[bench]]
name = "exact_index_ram"
harness = false

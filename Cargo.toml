[package]
name = "bittice"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
bincode = "1.3"
roaring = { version = "0.10", features = ["serde"] }
# Nuevas dependencias para CLI
clap = { version = "4.4", features = ["derive"] }
dialoguer = "0.11"
indicatif = "0.17"
anyhow = "1.0"
console = "0.15"
# rustyline = "14.0" # Ya no lo necesitamos para el menú principal
shell-words = "1.1"
ratatui = "0.26"
crossterm = "0.27"
memmap2 = "0.9"
tokio = { version = "1.36", features = ["full"] }
axum = { version = "0.7.5", features = ["macros"] }
tower-http = { version = "0.5.2", features = ["trace", "cors"] }
tracing = "0.1.40"
tracing-subscriber = "0.3.18"
arboard = "3.3"
rayon = "1.10"
uuid = { version = "1.21.0", features = ["v4"] }
tonic = "0.12"
prost = "0.13"
tokio-stream = "0.1"

[dev-dependencies]
tempfile = "3.10"
reqwest = { version = "0.11", features = ["json"] }

[build-dependencies]
tonic-build = "0.12"
